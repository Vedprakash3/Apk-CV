<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download App Release</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #0f172a; 
      color: white; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
    }
   .container { 
      background: #1e293b; 
      padding: 2.5rem; 
      border-radius: 16px; 
      text-align: center; 
      max-width: 400px; 
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
   .app-icon { 
      width: 100px; 
      height: 100px; 
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px; 
      margin: 0 auto 1.5rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 3rem;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
   .version { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.9rem; }
   .download-btn { 
      background: #22c55e; 
      color: white; 
      padding: 1rem 2rem; 
      border: none; 
      border-radius: 10px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      cursor: pointer; 
      width: 100%;
      transition: 0.3s;
    }
   .download-btn:hover { background: #16a34a; transform: translateY(-2px); }
   .size { color: #94a3b8; margin-top: 1rem; font-size: 0.85rem; }
   .note { 
      background: #334155; 
      padding: 0.8rem; 
      border-radius: 8px; 
      margin-top: 1.5rem; 
      font-size: 0.8rem; 
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-icon">🚀</div>
    <h1>App Release</h1>
    <p class="version">Latest Build | GitHub Hosted</p>
    
    <button class="download-btn" onclick="downloadAPK()">
      ⬇️ Install App-Release.apk
    </button>
    
    <p class="size" id="fileSize">Size: Loading...</p>
    
    <div class="note">
      ⚠️ Android Settings > Security > "Install from Unknown Sources" enable karna padega
    </div>
  </div>

  <script>
    // TERA LINK YAHAN DAAL DIYA HAI ✅
    const apkUrl = "https://raw.githubusercontent.com/Vedprakash3/Apk-CV/refs/heads/main/App-Release.apk"; 
    
    const apkFileName = "App-Release.apk";
    
    fetch(apkUrl, { method: 'HEAD' }).then(res => {
      const size = res.headers.get('content-length');
      if(size) {
        document.getElementById('fileSize').innerText = `Size: ${(size/1024/1024).toFixed(2)} MB`;
      } else {
        document.getElementById('fileSize').innerText = "Size: Unknown";
      }
    }).catch(err => {
      document.getElementById('fileSize').innerText = "Size: Unknown";
    });

    function downloadAPK() {
      const link = document.createElement('a');
      link.href = apkUrl;
      link.download = apkFileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      alert("Download shuru ho gaya! Downloads folder check kar 📂");
    }
  </script>
</body>
</html>
